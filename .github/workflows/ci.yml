name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  protected-preflight:
    name: Protected configuration preflight
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - id: detect
        name: Detect protected configuration without exposing secrets
        shell: bash
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          TASK2_PROTECTED_HTTP_URL: ${{ secrets.TASK2_PROTECTED_HTTP_URL }}
          TASK2_PROTECTED_STORAGE_STATE_JSON: ${{ secrets.TASK2_PROTECTED_STORAGE_STATE_JSON }}
          TASK3_PROTECTED_DISPOSABLE_TENANT: ${{ secrets.TASK3_PROTECTED_DISPOSABLE_TENANT }}
          TASK3_PROTECTED_FIXTURE_ORGANIZATION_ID: ${{ secrets.TASK3_PROTECTED_FIXTURE_ORGANIZATION_ID }}
          TASK3_PROTECTED_CROSS_TENANT_ORGANIZATION_ID: ${{ secrets.TASK3_PROTECTED_CROSS_TENANT_ORGANIZATION_ID }}
        run: |
          if [[ -n "$CONVEX_DEPLOYMENT$CONVEX_DEPLOY_KEY$NEXT_PUBLIC_CONVEX_URL$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY$TASK2_PROTECTED_HTTP_URL$TASK2_PROTECTED_STORAGE_STATE_JSON" ]]; then
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          fi

  protected:
    name: Protected Convex + Clerk integration
    runs-on: ubuntu-latest
    needs: [verify, protected-preflight]
    if: ${{ needs.protected-preflight.outputs.configured == 'true' }}
    env:
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      TASK2_PROTECTED_STORAGE_STATE_JSON: ${{ secrets.TASK2_PROTECTED_STORAGE_STATE_JSON }}
      TASK2_PROTECTED_HTTP_URL: ${{ secrets.TASK2_PROTECTED_HTTP_URL }}
      TASK3_PROTECTED_DISPOSABLE_TENANT: ${{ secrets.TASK3_PROTECTED_DISPOSABLE_TENANT }}
      TASK3_PROTECTED_FIXTURE_ORGANIZATION_ID: ${{ secrets.TASK3_PROTECTED_FIXTURE_ORGANIZATION_ID }}
      TASK3_PROTECTED_CROSS_TENANT_ORGANIZATION_ID: ${{ secrets.TASK3_PROTECTED_CROSS_TENANT_ORGANIZATION_ID }}
      TASK3_PROTECTED_OWNER_CLERK_ID: ${{ secrets.TASK3_PROTECTED_OWNER_CLERK_ID }}
      TASK3_PROTECTED_OPERATOR_CLERK_ID: ${{ secrets.TASK3_PROTECTED_OPERATOR_CLERK_ID }}
      TASK3_PROTECTED_STAFF_CLERK_ID: ${{ secrets.TASK3_PROTECTED_STAFF_CLERK_ID }}
      TASK3_PROTECTED_OWNER_ROLE: ${{ secrets.TASK3_PROTECTED_OWNER_ROLE }}
      TASK3_PROTECTED_OPERATOR_ROLE: ${{ secrets.TASK3_PROTECTED_OPERATOR_ROLE }}
      TASK3_PROTECTED_STAFF_ROLE: ${{ secrets.TASK3_PROTECTED_STAFF_ROLE }}
      TASK3_PROTECTED_OWNER_STORAGE_STATE: ${{ secrets.TASK3_PROTECTED_OWNER_STORAGE_STATE }}
      TASK3_PROTECTED_OPERATOR_STORAGE_STATE: ${{ secrets.TASK3_PROTECTED_OPERATOR_STORAGE_STATE }}
      TASK3_PROTECTED_STAFF_STORAGE_STATE: ${{ secrets.TASK3_PROTECTED_STAFF_STORAGE_STATE }}
      TASK3_PROTECTED_CROSS_TENANT_STORAGE_STATE: ${{ secrets.TASK3_PROTECTED_CROSS_TENANT_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:protected
